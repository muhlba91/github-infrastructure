---
name: homelab-home-cluster-applications
description: "Homelab: Applications running on the Kubernetes home-cluster"
visibility: public
protected: true
topics:
  - kubernetes
  - homelab
  - gitops
  - fluxcd

rulesets:
  branch:
    enabled: true
    requiredChecks:
      - Dependency Review
      - YAMLLint
      - Shellcheck
      - Ruff
      - Manifests
      - Flate (vie)
      - Flate (hochschule-burgenland)
      - actionlint
      - Markdownlint
      - Gitleaks

accessPermissions:
  vault:
    enabled: false
